spring.application.name=shopsphere-backend
server.port=${PORT:8080}

# TiDB Cloud connection
spring.datasource.url=jdbc:mysql://${TIDB_HOST}:${TIDB_PORT:4000}/${TIDB_DATABASE:shopsphere_db}?sslMode=VERIFY_IDENTITY&serverTimezone=Asia/Kolkata
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT: set a strong secret through an environment variable
shopsphere.jwt.secret=${SHOPSPHERE_JWT_SECRET}
shopsphere.jwt.expiration-ms=86400000

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Safer error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never